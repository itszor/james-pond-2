; libroger's settings for robocod (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; the game sets its own VIDC timing as it starts, before anything is
; drawn: 208 lines, rows 0-207 in its window (game.c's window_y), for the
; title, the loading screens and the game (the play area and the panel
; at its foot)
rows = 0-207
